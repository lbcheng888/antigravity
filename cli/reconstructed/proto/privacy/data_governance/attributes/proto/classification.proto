    enum LocationType {
      option (unresolved_option_306455367) = "It defines what type of user location at the moment of recording the described dataset contains. This is a tree of values, the children values are specialisation that can be used to define more precisely the location type.";
      option (unresolved_option_321189327) = "go/dg-classification:geo_location#Data.LocationType";
      LOCATION_UNDEFINED = 0;
      USER_LOCATION = 1 [(unresolved_option_204438976) = "User Location", (unresolved_option_204438977) = "It is the user location at one point in time. Note that if we have a USER_LOCATION, the 'source' field of a DG Annotations needs to at least contain a SOURCE_USER or one of its children.", (unresolved_option_321358229) = "go/dg-classification:geo_location#Data.LocationType.USER_LOCATION"];
      USER_DIRECT_LOCATION = 2 [(unresolved_option_204438976) = "User Direct Location", (unresolved_option_204438977) = "The location is expressed as a coordinate or as geographical element.", (unresolved_option_206747693) = "USER_LOCATION", (unresolved_option_321358229) = "go/dg-classification:geo_location#Data.LocationType.USER_DIRECT_LOCATION"];
      USER_INDIRECT_LOCATION = 3 [(unresolved_option_204438976) = "User Indirect Location", (unresolved_option_204438977) = "The location can be guessed through a combination of data.", (unresolved_option_206747693) = "USER_LOCATION", (unresolved_option_321358229) = "go/dg-classification:geo_location#Data.LocationType.USER_INDIRECT_LOCATION"];
      USER_CONTEXTUAL_LOCATION = 4 [(unresolved_option_204438976) = "User Contextual Location", (unresolved_option_204438977) = "The location is not directly a pair of coordinates but a place or a concept.", (unresolved_option_206747693) = "USER_LOCATION", (unresolved_option_321358229) = "go/dg-classification:geo_location#Data.LocationType.USER_CONTEXTUAL_LOCATION"];
      NOT_A_USER_LOCATION = 5 [(unresolved_option_204438976) = "Not A User Location", (unresolved_option_204438977) = "This is not the location of the user. It might still contain location data -- but not the location of a user. This is equivalent to 'location: NO' value.", (unresolved_option_321358229) = "go/dg-classification:geo_location#Data.LocationType.NOT_A_USER_LOCATION"];
      USER_PLACE_OF_INTEREST = 7 [(unresolved_option_204438976) = "User Place of Interest", (unresolved_option_204438977) = "This is not the location of the user, it is a place inferred to be of interest to the user (e.g. a place a user has browsed, but we have no indication that the user was there or intends to go there). Asking for directions to a place still only makes it a USER_PLACE_OF_INTEREST - not a user location, as they may never go there (e.g. just checking travel time and we have no indication that the user actually had an intent to go). Navigating to a location would make this a USER_LOCATION (or one if its children), not a USER_PLACE_OF_INTEREST.", (unresolved_option_321358229) = "go/dg-classification:geo_location#Data.LocationType.USER_PLACE_OF_INTEREST"];
      USER_HOME_LOCATION = 8 [(unresolved_option_204438976) = "User Home Location", (unresolved_option_204438977) = "This is not the location of the user, it is the user's home location. Only use this label if the location is the Google wide confirmed home location set in Google Account. It should not be used for anything that is inferred, or shipping addresses that happen to be associated with home. Please contact oolong-team@ when in doubt.", (unresolved_option_321358229) = "go/dg-classification:geo_location#Data.LocationType.USER_HOME_LOCATION"];
      USER_WORK_LOCATION = 9 [(unresolved_option_204438976) = "User Work Location", (unresolved_option_204438977) = "This is not the location of the user, it is the user's work location. Only use this label if the location is the Google wide confirmed work location set in Google Account. It should not be used for anything that is inferred, or shipping addresses that happen to be associated with work. Please contact oolong-team@ when in doubt.", (unresolved_option_321358229) = "go/dg-classification:geo_location#Data.LocationType.USER_WORK_LOCATION"];
