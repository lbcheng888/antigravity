      COARSE_AT_1_PLUS_1_LEVEL = 2 [(unresolved_option_204438976) = "Coarse At 1+1 level", (unresolved_option_204438977) = "The location covers at least 1 square kilometers in size and an estimated of 1000 or more 14-days active internet users.", (unresolved_option_321358229) = "go/dg-classification:geo_location#Data.Coarse.COARSE_AT_1_PLUS_1_LEVEL"];
      COARSE_AT_3_PLUS_1_LEVEL = 3 [(unresolved_option_204438976) = "Coarse At 3+1 level", (unresolved_option_204438977) = "The location has at least 3 square kilometers in size and an estimated of 1000 or more 14-days active internet users.", (unresolved_option_321358229) = "go/dg-classification:geo_location#Data.Coarse.COARSE_AT_3_PLUS_1_LEVEL"];
