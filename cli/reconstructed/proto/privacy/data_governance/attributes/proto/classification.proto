  message TeensCategory {
    HasCategory teens_data = 1 [(unresolved_option_233938569) = "Teens' data", (unresolved_option_233938575) = "Teens's data is user data relating to Teens. Teens are users that we know to be above the age of consent in their respective country but below the age of 18 (meaning, Minors who are not Children). Because of regional differences in age of consent, in some countries 'Teens' may be 16-18 while in others they may be from 13, 14 or 15 years old to 18.", (unresolved_option_307041375) = "CONFIDENTIALITY_NEED_TO_KNOW", (unresolved_option_321231810) = "go/dg-classification:minors_data#Data.minors_data.teens_data"];
  }

  message ChildrenCategory {
    HasCategory children_data = 1 [(unresolved_option_233938569) = "Children's data", (unresolved_option_233938575) = "Children's data is user data relating to Children. Children are users that we know to be below the applicable age of consent in their respective country. If this field is selected, there is no need to select unicorns_data, griffins_data, or edu_children_data as this will cover all of them. Please only select the specific children category if your product has restrictions for certain child users.", (unresolved_option_307041375) = "CONFIDENTIALITY_NEED_TO_KNOW", (unresolved_option_321231810) = "go/dg-classification:minors_data#Data.minors_data.children_data"];
    HasCategory unicorns_data = 2 [(unresolved_option_233938569) = "Unicorns' data", (unresolved_option_233938575) = "Unicorns' data is user data relating to unicorns. Unicorns are consumer accounts that were created with a birthdate under age of consent at creation time. They were created with parental consent, and have always been treated as an underage account.", (unresolved_option_307041375) = "CONFIDENTIALITY_NEED_TO_KNOW", (unresolved_option_321231810) = "go/dg-classification:minors_data#Data.minors_data.unicorns_data"];
    HasCategory griffins_data = 3 [(unresolved_option_233938569) = "Griffins' data", (unresolved_option_233938575) = "Griffins' data is user data relating to griffins. Griffins are consumer accounts that were created as regular Google accounts over age of consent, but are now under age of consent, either because the user's country increased the age of consent, or because the user changed their birthdate on the account. Parental consent and supervision have been added after account creation.", (unresolved_option_307041375) = "CONFIDENTIALITY_NEED_TO_KNOW", (unresolved_option_321231810) = "go/dg-classification:minors_data#Data.minors_data.griffins_data"];
    HasCategory edu_children_data = 4 [(unresolved_option_233938569) = "Edu children's data", (unresolved_option_233938575) = "Edu children's data is user data relating to edu child users. Edu child users are Enterprise/Dasher accounts created and managed by a school administrator. Users created in a K12 (primary or secondary) school are defaulted to <18 status. Due to the sensitivity of users in an educational context, Google Workspace for Education <18 users are often treated similarly to 'children under age of consent', even though they may be up to 18 years old.", (unresolved_option_307041375) = "CONFIDENTIALITY_NEED_TO_KNOW", (unresolved_option_321231810) = "go/dg-classification:minors_data#Data.minors_data.edu_children_data"];
  }

